[project]
name = "py-lead-generation"
version = "0.1.0"
description = "A Python package for lead generation using web scraping"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Madi-S", email = "madi@example.com" }]
keywords = ["lead-generation", "scraping", "yelp", "google-maps", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]

dependencies = [
    "beautifulsoup4>=4.12.0",
    "geopy>=2.4.0",
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "python-slugify>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "types-requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/Madi-S/Lead-Generation"
Repository = "https://github.com/Madi-S/Lead-Generation"
Issues = "https://github.com/Madi-S/Lead-Generation/issues"

[project.scripts]
lead-gen-mcp = "py_lead_generation.src.mcp.server:main"
lead-gen-gui = "py_lead_generation.src.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_lead_generation"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["py_lead_generation"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "types-requests>=2.31.0",
]
